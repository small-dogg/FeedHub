spring:
  application:
    name: feed-hub-api
  datasource:
    url: jdbc:postgresql://jerry.world:32222/feed_hub
    driver-class-name: org.postgresql.Driver
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:30092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
server:
  port: ${SERVER_PORT:12001}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:feedhub-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}
  expiration-ms: 86400000  # 24 hours
